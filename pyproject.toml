[project]
name = "running-coach"
version = "1.0.0"
description = "A self-hosted running dashboard and coach built on your own Garmin data"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "garminconnect>=0.2.25",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "tzdata",      # timezone database for ZoneInfo on Windows / slim images
    "anthropic",   # optional chat upgrade — only used when ANTHROPIC_API_KEY is set
]

[dependency-groups]
dev = ["httpx"]    # fastapi.testclient for the smoke tests

[tool.uv]
package = false
